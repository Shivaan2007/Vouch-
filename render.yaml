# Render Blueprint, FREE plan. Free instances sleep when idle and lose local files when they sleep, restart or
# redeploy, so pairings are lost then. Keep it awake with a pinger (see server/DEPLOY.md).
# For persistence, change plan to starter and add:  disk: { name: vouch-data, mountPath: /var/data, sizeGB: 1 }
# with DB_PATH=/var/data/vouch.db (costs money; check render.com/pricing).
services:
  - type: web
    name: vouch
    runtime: node
    plan: free
    buildCommand: npm ci
    # Vouch WITH Watch: the Telegram bot, the AI read, call listening and app alerts. "npm start" runs the core server alone.
    startCommand: node bot/serve.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_PATH
        value: /tmp/vouch.db
      - key: DEMO_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Watch (optional; each one switches a feature on). Never commit values; set them in the dashboard.
      - key: BOT_TOKEN
        sync: false
      - key: VOUCH_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: WATCH_SALT
        generateValue: true
